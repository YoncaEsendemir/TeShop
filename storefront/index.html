<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <!-- Tema: React'ten önce data-theme'i set et (FOUC yok) -->
    <script>
      (function () {
        try {
          var t = 'dark'
          var raw = localStorage.getItem('teshop-theme')
          if (raw) {
            var p = JSON.parse(raw)
            t = (p && p.state && p.state.theme) || 'dark'
          }
          var dark =
            t === 'dark' ||
            (t === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TeShop — modern, minimal koyu tema giyim mağazası." />

    <!-- Fontlar: Space Grotesk (başlık) + Inter (gövde) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>TeShop</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
